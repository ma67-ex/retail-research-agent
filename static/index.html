<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Research Agent</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11151d; --border: #232a36;
    --text: #e6e9ef; --muted: #8a93a3; --accent: #3ddc97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  .chat-col { flex: 2; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .trace-col { flex: 1; display: flex; flex-direction: column; min-width: 260px; }
  .col-title {
    padding: 10px 16px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--border);
  }
  #messages, #trace { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 14px; max-width: 85%; }
  .msg.user { margin-left: auto; text-align: right; }
  .msg .bubble {
    display: inline-block; padding: 10px 14px; border-radius: 10px; line-height: 1.45; font-size: 14px;
  }
  .msg.user .bubble { background: var(--accent); color: #06130d; }
  .msg.agent .bubble { background: var(--panel); border: 1px solid var(--border); }
  .msg.pending .bubble { color: var(--muted); font-style: italic; }
  .tool-call {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 10px; font-size: 12px;
  }
  .tool-call .name { color: var(--accent); font-weight: 600; }
  .tool-call pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; color: var(--muted); }
  form {
    display: flex; gap: 8px; padding: 14px; border-top: 1px solid var(--border);
  }
  input {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 14px;
  }
  button {
    background: var(--accent); border: none; color: #06130d; font-weight: 600;
    padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  @media (max-width: 700px) {
    main { flex-direction: column; }
    .chat-col { flex: 3; border-right: none; border-bottom: 1px solid var(--border); min-height: 0; }
    .trace-col { flex: 2; min-width: 0; min-height: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Retail Research Agent</h1>
  <span>local model &middot; live market data &middot; no paid API</span>
</header>
<main>
  <section class="chat-col">
    <div id="messages"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="e.g. What's AAPL's trailing P/E ratio?">
      <button type="submit" id="send">Ask</button>
    </form>
  </section>
  <section class="trace-col">
    <div class="col-title">Tool calls (live trace)</div>
    <div id="trace"></div>
  </section>
</main>
<script>
  const messages = document.getElementById('messages');
  const trace = document.getElementById('trace');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<div class="bubble"></div>';
    div.querySelector('.bubble').textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function addToolCalls(calls) {
    for (const c of calls) {
      const div = document.createElement('div');
      div.className = 'tool-call';
      div.innerHTML = '<span class="name"></span><pre></pre>';
      div.querySelector('.name').textContent = c.tool + '(' + JSON.stringify(c.args) + ')';
      div.querySelector('pre').textContent = JSON.stringify(c.result, null, 2);
      trace.appendChild(div);
    }
    trace.scrollTop = trace.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const task = input.value.trim();
    if (!task) return;
    addMessage('user', task);
    input.value = '';
    send.disabled = true;
    const pending = addMessage('agent pending', 'thinking…');
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task }),
      });
      const data = await res.json();
      pending.remove();
      addMessage('agent', data.answer);
      addToolCalls(data.trace);
    } catch (err) {
      pending.remove();
      addMessage('agent', 'Error: ' + err.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
